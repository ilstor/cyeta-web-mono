name: Next.js Build with Yarn

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Specify your desired Node.js version
          cache: 'yarn' # This enables dependency caching for Yarn

      - name: Install dependencies
        run: yarn install

      - name: Build Next.js application
        run: yarn build